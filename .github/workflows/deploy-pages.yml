name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'loopdive/js2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          # Smudge LFS-tracked files. Without this, .wasm/.log files arrive as
          # pointer stubs and any binary served from public/ ships as text —
          # e.g. loadtime wasm modules failing with `expected magic word 00 61
          # 73 6d, found 76 65 72 73`. Loadtime artifacts are also opted out
          # of LFS via .gitattributes for safety.
          lfs: true

      - name: Fetch baseline data from baselines repo
        run: |
          # Baseline JSONL and summary JSON now live in js2wasm-baselines,
          # not in LFS on the main repo, to avoid LFS bandwidth exhaustion.
          git clone --depth=1 https://github.com/loopdive/js2wasm-baselines.git /tmp/js2wasm-baselines 2>/dev/null || true
          if [ -f /tmp/js2wasm-baselines/test262-current.json ]; then
            mkdir -p website/public/benchmarks/results benchmarks/results/runs
            cp /tmp/js2wasm-baselines/test262-current.json   website/public/benchmarks/results/test262-report.json
            cp /tmp/js2wasm-baselines/test262-current.json   benchmarks/results/test262-current.json
            cp /tmp/js2wasm-baselines/test262-current.json   benchmarks/results/test262-report.json
            if [ -f /tmp/js2wasm-baselines/test262-current.jsonl ]; then
              cp /tmp/js2wasm-baselines/test262-current.jsonl website/public/benchmarks/results/test262-results.jsonl
              # build:pages → generate-editions.ts regenerates test262-editions.json
              # at deploy time and reads benchmarks/results/test262-current.jsonl
              # (its CURRENT_RESULTS_JSONL input). Overwrite the STALE committed
              # copy with the FRESH baseline so the regenerated #goals edition
              # slider matches the live headline. Without this, the deploy falls
              # back to the stale committed jsonl and the slider shows old
              # cumulative numbers (~65%) while the donut shows ~71% (#1885).
              cp /tmp/js2wasm-baselines/test262-current.jsonl benchmarks/results/test262-current.jsonl
            fi
            [ -f /tmp/js2wasm-baselines/runs/index.json ] && \
              cp /tmp/js2wasm-baselines/runs/index.json benchmarks/results/runs/index.json
            echo "Fetched baseline data from js2wasm-baselines."
          else
            echo "Warning: baselines repo not available — pages will build with stale/empty baseline."
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        run: pnpm build:pages

      - name: Publish graph data snapshot to labs
        env:
          GRAPH_DATA_SHA: ${{ github.sha }}
          LABS_DEPLOY_KEY: ${{ secrets.LABS_DEPLOY_KEY }}
        run: |
          if [ -z "${LABS_DEPLOY_KEY:-}" ]; then
            echo "LABS_DEPLOY_KEY is not configured; skipping labs graph-data publish."
            exit 0
          fi

          test -s website/public/graph-data.json

          eval "$(ssh-agent -s)"
          echo "$LABS_DEPLOY_KEY" | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          if ! git clone --depth=1 --branch labs/graph-data git@github.com:loopdive/js2wasm-labs.git "$tmp_dir/repo"; then
            rm -rf "$tmp_dir/repo"
            git clone --depth=1 git@github.com:loopdive/js2wasm-labs.git "$tmp_dir/repo"
            cd "$tmp_dir/repo"
            git checkout --orphan labs/graph-data
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cd "$tmp_dir/repo"
          mkdir -p website/public
          cp "$GITHUB_WORKSPACE/website/public/graph-data.json" website/public/graph-data.json
          short_sha="$(printf '%.12s' "$GRAPH_DATA_SHA")"
          cat > README.md <<EOF
          # js2 dependency graph data

          This branch contains the generated \`website/public/graph-data.json\`
          snapshot from \`loopdive/js2\`.

          Source commit: $GRAPH_DATA_SHA

          Regenerated by \`.github/workflows/deploy-pages.yml\`; do not edit by hand.
          EOF

          if [ -z "$(git status --porcelain -- README.md website/public/graph-data.json)" ]; then
            echo "Graph data unchanged; skipping labs push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md website/public/graph-data.json
          git commit -m "chore(graph-data): refresh from js2 $short_sha"
          git push origin HEAD:labs/graph-data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    if: github.repository == 'loopdive/js2'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
