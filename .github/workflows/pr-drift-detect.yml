name: PR drift detector

# When main moves, check every open PR with auto-merge enabled to see how
# many non-[skip ci] commits its base is behind. If drift > threshold, post
# a comment on the PR tagging the tech-lead role. The tech-lead's local
# polling task picks up the comment and dispatches an agent to:
#   1. merge main into the PR branch
#   2. semantically review the resulting diff (LLM-driven; not CI)
#   3. push if safe → triggers fresh PR-level test262 → PR re-eligible for queue
#
# Without strict_required_status_checks_policy this would be advisory only.
# WITH strict policy enabled, GitHub automatically bounces drifted PRs from
# the queue — this workflow's job is just to surface the bounce as an
# actionable agent-dispatch signal.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Threshold: post a comment when a PR's base is behind by this many
      # non-[skip ci] commits. Tune as drift-rate observation comes in.
      DRIFT_THRESHOLD: 1
    steps:
      - name: Detect drifted PRs and comment
        run: |
          set -euo pipefail
          MAIN_HEAD=$(gh api repos/${{ github.repository }}/branches/main --jq '.commit.sha')
          echo "main HEAD: $MAIN_HEAD"

          # List open PRs targeting main with auto-merge enabled (= queue candidates).
          PRS=$(gh api repos/${{ github.repository }}/pulls \
                  --paginate -X GET -f state=open -f base=main \
                  --jq '.[] | select(.auto_merge != null) | {number: .number, base_sha: .base.sha, head_sha: .head.sha}')

          echo "$PRS" | jq -r '"PR #\(.number) base=\(.base_sha[0:9]) head=\(.head_sha[0:9])"' || true

          echo "$PRS" | jq -c '.' | while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            base=$(echo "$pr" | jq -r '.base_sha')

            # Count non-[skip ci] commits between PR base and current main HEAD.
            # Use compare API to avoid local clone overhead.
            DRIFT_COMMITS=$(gh api "repos/${{ github.repository }}/compare/$base...$MAIN_HEAD" \
                              --jq '[.commits[] | select(.commit.message | contains("[skip ci]") | not)] | length' \
                              2>/dev/null || echo 0)

            if [ "$DRIFT_COMMITS" -ge "$DRIFT_THRESHOLD" ]; then
              echo "PR #$number drift = $DRIFT_COMMITS non-skip commits — commenting"

              # Skip if we already posted a drift comment for this exact main HEAD.
              # The comment body carries the main HEAD sha so we can dedupe.
              MARKER="<!-- pr-drift-detector main=$MAIN_HEAD -->"
              EXISTING=$(gh api repos/${{ github.repository }}/issues/$number/comments \
                           --paginate \
                           --jq "[.[] | select(.body | contains(\"$MARKER\"))] | length" \
                           || echo 0)
              if [ "$EXISTING" -gt 0 ]; then
                echo "  already commented for this main HEAD — skipping"
                continue
              fi

              COMMENT_BODY=$(cat <<EOF
$MARKER
🔄 **Main has moved while this PR is waiting in the merge queue.**

- main HEAD: \`${MAIN_HEAD:0:9}\`
- PR base:   \`${base:0:9}\`
- Drift:     **$DRIFT_COMMITS** non-\`[skip ci]\` commits behind

**@claude** — please merge main into this branch.

Tasks:
1. \`git merge origin/main\` into the branch in this PR's worktree
2. Review the combined diff semantically (look for API drift, semantic
   conflicts not caught by git — same-symbol renames in different files,
   API signature changes whose callers landed in main, etc.)
3. If safe: push the merge commit → fresh CI runs → PR re-enters queue.
   If conflicts or risk: comment back with what needs human help.
EOF
)
              gh api repos/${{ github.repository }}/issues/$number/comments \
                -X POST \
                -f body="$COMMENT_BODY" >/dev/null
              echo "  comment posted"
            else
              echo "PR #$number drift = $DRIFT_COMMITS — within threshold"
            fi
          done
