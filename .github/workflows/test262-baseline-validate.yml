name: Test262 baseline validate

# Spot-check 50 random `pass` entries from the LIVE baseline in
# `loopdive/js2wasm-baselines` against current PR HEAD on every PR.
#
# Why: the baseline JSONL is what `dev-self-merge` Step 4 reads for
# bucket-by-path regression analysis. Sampling 50 random "pass" entries on
# every PR is a 0.1% spot check; any miss strongly suggests the baseline is
# stale or corrupt and the dev-self-merge gate is no longer reliable.
#
# The baselines repo is updated by `promote-baseline` in test262-sharded.yml
# after every successful push-to-main run — always at most one sharded-run
# behind main, never behind a PR's own changes.
#
# As of #1528, the validator script calls `scripts/fetch-baseline-jsonl.mjs`
# directly to populate `.test262-cache/test262-current.jsonl`, so no
# pre-fetch step is required here.
#
# Cost: ~1 minute per run (50 tests × ~1s). See #1218 / #1528.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/validate-test262-baseline.ts"
      - ".github/workflows/test262-baseline-validate.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  baseline-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (with test262 submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - run: pnpm install --frozen-lockfile

      - name: Validate baseline
        env:
          # Deterministic seed derived from the PR number — same PR re-runs
          # always sample the same 50 tests.
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
        # The validator self-fetches the baseline JSONL from
        # loopdive/js2wasm-baselines via scripts/fetch-baseline-jsonl.mjs
        # (#1528). No pre-fetch step needed.
        run: npx tsx scripts/validate-test262-baseline.ts
