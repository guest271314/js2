name: Test262 PR stub

# PR-level companion to test262-sharded.yml. Produces the two required checks
# ("cheap gate (main-ancestor + lint)" and "merge shard reports") cheaply on
# every PR push so PRs can enter the merge queue without paying for the heavy
# 32-shard test262. The queue's merge_group event runs the real test262 on
# the merge candidate — that's where regressions are gated for actual merges.

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: test262-pr-stub-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: cheap gate (main-ancestor + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck + lint
        run: |
          pnpm run typecheck 2>&1 | tail -50 || (echo "::error::typecheck failed"; exit 1)
          if grep -q '"lint"' package.json; then pnpm run lint 2>&1 | tail -50; fi

  merge-report:
    name: merge shard reports
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - name: Stub-pass (real 32-shard test262 runs in merge_group)
        run: |
          echo "→ PR-level stub — does not run test262."
          echo "→ The merge queue (merge_group event) runs full 32-shard test262 on"
          echo "  the temp merge-with-main branch before merging. That gate is what"
          echo "  actually validates the merge."
          echo "→ This stub produces a green 'merge shard reports' check to satisfy"
          echo "  the PR-level required-check gate so the PR can enter the queue."
